# Production stack on the EC2 host (infra/lib/backend-stack.ts). Only Caddy is
# reachable from the internet (80/443); everything else talks on the compose
# network. Images are pinned. Container logs go straight to CloudWatch Logs.
name: lendloop

x-log-opts: &log-opts
  awslogs-region: ${AWS_REGION:?}
  mode: non-blocking
  max-buffer-size: 4m

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      - BASE_DOMAIN=${BASE_DOMAIN}
      - N8N_EDITOR_HASH=${N8N_EDITOR_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    logging:
      driver: awslogs
      options:
        <<: *log-opts
        awslogs-group: /lendloop/prod/caddy

  convex:
    image: ghcr.io/convex/convex-backend@sha256:207cf95def42f01614b6e3af0af5c20d0dcaa5ff2adf258ee7bc9555576644fa
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    # Host-only, for the metrics poller (metrics.sh) and admin tasks.
    ports: ["127.0.0.1:3210:3210", "127.0.0.1:3211:3211"]
    volumes: [convex-data:/convex/data]
    environment:
      - INSTANCE_SECRET=${CONVEX_INSTANCE_SECRET:?}
      - CONVEX_CLOUD_ORIGIN=https://convex.${BASE_DOMAIN}
      - CONVEX_SITE_ORIGIN=https://site.${BASE_DOMAIN}
      - DISABLE_BEACON=true
      - DOCUMENT_RETENTION_DELAY=172800
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 10s
      start_period: 20s
    logging:
      driver: awslogs
      options:
        <<: *log-opts
        awslogs-group: /lendloop/prod/convex

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.45.7
    restart: unless-stopped
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?}
      - N8N_HOST=n8n.${BASE_DOMAIN}
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.${BASE_DOMAIN}/
      - N8N_PROXY_HOPS=1
      - N8N_SECURE_COOKIE=true
      - GENERIC_TIMEZONE=UTC
      - TZ=UTC
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - LENDLOOP_TO_N8N_SECRET=${LENDLOOP_TO_N8N_SECRET:?}
      - N8N_TO_LENDLOOP_SECRET=${N8N_TO_LENDLOOP_SECRET:?}
      - LENDLOOP_CONVEX_SITE_URL=http://convex:3211
      - LENDLOOP_APP_URL=${LENDLOOP_APP_URL}
      - LENDLOOP_OPS_EMAIL=${LENDLOOP_OPS_EMAIL:-ops@lendloop.local}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n:/lendloop:ro
    depends_on: [mailpit]
    logging:
      driver: awslogs
      options:
        <<: *log-opts
        awslogs-group: /lendloop/prod/n8n

  # Captures all email until SES is set up; UI reachable only through an SSM
  # port-forward (no published port).
  mailpit:
    image: axllent/mailpit:v1.33.0
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        <<: *log-opts
        awslogs-group: /lendloop/prod/mailpit

volumes:
  caddy-data:
  convex-data:
  n8n-data:
