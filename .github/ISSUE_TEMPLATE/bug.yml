name: Bug report
description: Something isn't working as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please don't report security vulnerabilities here — use Security → Report a vulnerability."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to …\n2. Click …\n3. See …"
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Page or feature
      placeholder: e.g. /tools, Incoming, overdue reminder email
  - type: textarea
    id: env
    attributes:
      label: Browser, device and anything else useful
