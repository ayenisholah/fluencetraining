name: Deploy
# Every push to main (a merged PR included) deploys to production once CI has
# passed on that commit: no manual step. Pull requests run CI only; they never
# deploy. The production environment accepts deployments from main alone.
# The organisation's SCP forbids GitHub OIDC, so AWS access uses the scoped
# `lendloop-github-deployer` IAM user, whose only power is to assume the CDK
# roles and run the deploy steps (infra/lib/deployer-stack.ts). Rotate its key
# with scripts/aws/create-deploy-key.sh.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Only CI runs started by a push to main: a fork's PR from a branch that
    # happens to be called main also reports head_branch main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    # The URL shows on the repository page (Deployments → production).
    environment:
      name: production
      url: https://lendloop.sholaayeni.xyz
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_JWT_ISSUER_DOMAIN: ${{ vars.CLERK_JWT_ISSUER_DOMAIN }}
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: npm ci
      - name: Infrastructure (CDK)
        run: (cd infra && npm ci) && bash scripts/aws/deploy-infra.sh
      - name: Convex functions and environment
        run: bash scripts/aws/configure-backend.sh
      - name: Refresh the host (bundle, n8n workflows)
        run: bash scripts/aws/refresh-host.sh
