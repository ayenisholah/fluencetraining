name: CI
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholder publishable key (decodes to a non-existent instance) so the
  # app builds without real credentials.
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2ktcGxhY2Vob2xkZXIuY2xlcmsuYWNjb3VudHMuZGV2JA
  NEXT_PUBLIC_CONVEX_URL: https://ci-placeholder.convex.cloud
  # CI has no system Chrome: use Playwright's bundled Chromium.
  PLAYWRIGHT_CHANNEL: ""

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatting (Prettier)
        run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit, component and Convex tests
        run: npm test
      - name: Colour contrast (WCAG AA)
        run: npm run check:contrast
      - name: Workflow exports contain no credential data
        run: |
          ! grep -rniE '"(password|apiKey|secret|token)"\s*:\s*"[^"]+"' n8n/workflows
      - name: Build
        run: npm run build
      - name: No secrets in the client bundle
        run: npm run check:bundle
      - name: No broken links on public pages
        env:
          CLERK_SECRET_KEY: sk_test_ci_placeholder
        run: |
          npm start -- --port 3000 &
          npx wait-on@8 http://localhost:3000/robots.txt
          npm run check:links

  infra:
    # The CDK app is its own package: typecheck, lint and synthesise it so a
    # broken stack fails the PR, not the deploy. Synth needs no AWS
    # credentials (the default-VPC lookup is cached in infra/cdk.context.json).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Synthesise every stack
        run: npx cdk synth --strict -q

  storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build Storybook
        run: npm run build-storybook -- --quiet
      - name: Story tests (render, play functions, axe)
        run: npm run test:storybook

  e2e:
    # Needs a Clerk development instance and a Convex deployment, provided as
    # repository secrets. Skipped (not failed) when they're absent, and never
    # run for pull requests from forks.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.E2E_CONVEX_URL }}
      E2E_PORT: "3100"
      E2E_SIGNED_IN: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
        if: env.CLERK_SECRET_KEY != ''
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: env.CLERK_SECRET_KEY != ''
        with:
          node-version: 22
          cache: npm
      - if: env.CLERK_SECRET_KEY != ''
        run: npm ci && npx playwright install --with-deps chromium && npm run build
      - name: Signed-out end-to-end suite
        if: env.CLERK_SECRET_KEY != ''
        run: npm run test:e2e:public
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
