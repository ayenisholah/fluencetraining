# Local stack: self-hosted Convex, n8n and Mailpit (catches all email).
# Everything binds to 127.0.0.1 only. Secrets come from .env (see .env.example).
name: lendloop

services:
  convex:
    image: ghcr.io/convex/convex-backend:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "127.0.0.1:3210:3210" # client API (NEXT_PUBLIC_CONVEX_URL)
      - "127.0.0.1:3211:3211" # HTTP actions (/n8n/*)
    volumes:
      - convex-data:/convex/data
    environment:
      - INSTANCE_SECRET=${CONVEX_INSTANCE_SECRET:?set CONVEX_INSTANCE_SECRET in .env}
      - CONVEX_CLOUD_ORIGIN=http://127.0.0.1:3210
      - CONVEX_SITE_ORIGIN=http://127.0.0.1:3211
      - DISABLE_BEACON=true
      - DOCUMENT_RETENTION_DELAY=172800
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s

  convex-dashboard:
    image: ghcr.io/convex/convex-dashboard:latest
    ports:
      - "127.0.0.1:6791:6791"
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=http://127.0.0.1:3210
    depends_on:
      convex:
        condition: service_healthy

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.45.7
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      - GENERIC_TIMEZONE=UTC
      - TZ=UTC
      - N8N_DIAGNOSTICS_ENABLED=false
      # Execution history holds recipient addresses and rendered email: keep a week.
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=5000
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_SECURE_COOKIE=false # plain http on localhost only
      # The Code nodes verify/sign HMACs with Node's crypto module and read the
      # shared secrets from the environment, never from workflow JSON.
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - LENDLOOP_TO_N8N_SECRET=${LENDLOOP_TO_N8N_SECRET:?}
      - N8N_TO_LENDLOOP_SECRET=${N8N_TO_LENDLOOP_SECRET:?}
      - LENDLOOP_CONVEX_SITE_URL=http://convex:3211
      - LENDLOOP_APP_URL=${LENDLOOP_APP_URL:-http://localhost:3000}
      - LENDLOOP_OPS_EMAIL=${LENDLOOP_OPS_EMAIL:-ops@lendloop.local}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n:/lendloop:ro
    depends_on:
      - mailpit

  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "127.0.0.1:8025:8025" # web UI; SMTP (1025) stays on the compose network

volumes:
  convex-data:
  n8n-data:
